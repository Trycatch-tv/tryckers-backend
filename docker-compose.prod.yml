services:
  api:
    image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG:-latest}
    restart: always
    container_name: tryckers_backend_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - JWT_SECRET=${JWT_SECRET:-tryckers_secret}
    networks:
      - tryckers_network

networks:
  tryckers_network:
    driver: bridge
