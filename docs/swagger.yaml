host: localhost:8080
info:
  contact:
    email: support@tryckers.com
    name: API Support
    url: https://tryckers.com/support
  description: |-
    A modern API for the Tryckers platform, providing user management and authentication services.
    This API allows you to manage users, handle authentication, and access user profiles.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Tryckers API
  version: "1.0"
paths:
  /cartelera:
    get:
      consumes:
      - application/json
      description: Retrieve the most popular posts of the last 7 days, ordered by
        votes
      produces:
      - application/json
      responses:
        "200":
          description: Top posts of the week
          schema:
            items:
              $ref: '#/definitions/dtos.ResponsePostDto'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get top posts of the week
      tags:
      - Posts
  /comments:
    post:
      consumes:
      - application/json
      description: Create a new comment on a post. The user_id is taken from the JWT
        token.
      parameters:
      - description: Comment data
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateCommentDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created comment
          schema:
            $ref: '#/definitions/models.Comment'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new comment
      tags:
      - Comments
  /comments/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-delete a comment. The comment author, post owner, or an admin
        can delete it.
      parameters:
      - description: Comment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Comment deleted successfully
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - Comments
    put:
      consumes:
      - application/json
      description: Update an existing comment. Only the comment author or an admin
        can update it.
      parameters:
      - description: Comment ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Comment update data
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateCommentDto'
      produces:
      - application/json
      responses:
        "200":
          description: Updated comment
          schema:
            $ref: '#/definitions/models.Comment'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a comment
      tags:
      - Comments
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return their information with an access
        token
      parameters:
      - description: Login credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/LoginUser'
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            $ref: '#/definitions/dtos.LoginResponse'
        "400":
          description: Invalid credentials format
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Authentication failed or internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: User login
      tags:
      - Auth
  /posts:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all posts (excluding deleted)
      produces:
      - application/json
      responses:
        "200":
          description: List of posts
          schema:
            items:
              $ref: '#/definitions/models.Post'
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get all posts
      tags:
      - Posts
    post:
      consumes:
      - application/json
      description: Create a new post. The user_id is taken from the JWT token.
      parameters:
      - description: Post data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/dtos.CreatePostDto'
      produces:
      - application/json
      responses:
        "201":
          description: Created post
          schema:
            $ref: '#/definitions/dtos.ResponsePostDto'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new post
      tags:
      - Posts
    put:
      consumes:
      - application/json
      description: Update an existing post. Only the post author or an admin can update
        it.
      parameters:
      - description: Post update data
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdatePostDto'
      produces:
      - application/json
      responses:
        "200":
          description: Updated post
          schema:
            $ref: '#/definitions/dtos.ResponsePostDto'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a post
      tags:
      - Posts
  /posts/{id}:
    delete:
      consumes:
      - application/json
      description: Soft-delete a post (sets status to deleted). Only the post author
        or an admin can delete it.
      parameters:
      - description: Post ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Post deleted successfully
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a post
      tags:
      - Posts
    get:
      consumes:
      - application/json
      description: Retrieve a specific post by its ID, including the logged user's
        vote
      parameters:
      - description: Post ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Post details
          schema:
            $ref: '#/definitions/dtos.ResponsePostDto'
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Post not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a post by ID
      tags:
      - Posts
  /posts/{id}/comments:
    get:
      consumes:
      - application/json
      description: Retrieve all comments for a specific post
      parameters:
      - description: Post ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of comments
          schema:
            items:
              $ref: '#/definitions/models.Comment'
            type: array
        "400":
          description: Invalid ID
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get comments by post ID
      tags:
      - Comments
  /posts/{id}/vote:
    post:
      consumes:
      - application/json
      description: 'Upvote or downvote a post. Vote value: 1 for upvote, -1 for downvote,
        0 to remove vote.'
      parameters:
      - description: Post ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Vote data
        in: body
        name: vote
        required: true
        schema:
          $ref: '#/definitions/dtos.VotePostDto'
      produces:
      - application/json
      responses:
        "200":
          description: Vote result
          schema:
            $ref: '#/definitions/models.PostVote'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Vote on a post
      tags:
      - Posts
  /profile/{username}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed profile information for a specific user by their
        username
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User profile information
          schema:
            $ref: '#/definitions/dtos.PublicUserResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get user profile by username
      tags:
      - Profile
  /refresh-token:
    post:
      consumes:
      - application/json
      description: Generate new access and refresh tokens using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: refresh_token
        required: true
        schema:
          $ref: '#/definitions/dtos.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New tokens
          schema:
            $ref: '#/definitions/dtos.RefreshTokenResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user in the system with the provided information
      parameters:
      - description: User registration information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/CreateUserDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created user
          schema:
            $ref: '#/definitions/CreateUserDTO'
