    type: object
  models.PostVote:
    properties:
      createdAt:
        type: string
      post:
        $ref: '#/definitions/models.Post'
      postID:
        type: string
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/User'
      userID:
        type: string
      vote:
        type: integer
