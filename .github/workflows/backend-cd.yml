name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'scripts/**'
      - '.github/workflows/backend-cd.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  DEPLOY_ROLE_ARN: arn:aws:iam::570743710918:role/tryckers-github-deploy-role
  ECR_REPOSITORY_URL: 570743710918.dkr.ecr.us-west-2.amazonaws.com/tryckers-backend
  EC2_INSTANCE_ID: i-007cfaf0508858c13

jobs:
  build-and-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check if image tag already exists in Amazon ECR
        id: check-ecr
        run: |
          IMAGE_EXISTS=$(aws ecr describe-images \
            --repository-name tryckers-backend \
            --image-ids imageTag=${{ github.sha }} \
            --region ${{ vars.AWS_REGION || env.AWS_REGION }} \
            --query "imageDetails[0].imageDigest" \
            --output text 2>/dev/null || echo "not-found")
          
          if [ "$IMAGE_EXISTS" != "not-found" ] && [ -n "$IMAGE_EXISTS" ]; then
            echo "Image for commit ${{ github.sha }} already exists in ECR. Skipping push to respect immutability."
            echo "skip_push=true" >> $GITHUB_OUTPUT
          else
            echo "skip_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.check-ecr.outputs.skip_push != 'true' }}
          load: ${{ steps.check-ecr.outputs.skip_push == 'true' }}
          tags: ${{ env.ECR_REPOSITORY_URL }}:${{ github.sha }}

      - name: Deploy to Amazon EC2 via AWS Systems Manager
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Sending deployment command to EC2 (${{ env.EC2_INSTANCE_ID }})..."
          
          python3 -c '
          import base64, json, os

          with open("scripts/deploy.sh", "rb") as f:
              deploy_b64 = base64.b64encode(f.read().replace(b"\r\n", b"\n")).decode("utf-8")

          with open("docker-compose.prod.yml", "rb") as f:
              compose_b64 = base64.b64encode(f.read().replace(b"\r\n", b"\n")).decode("utf-8")

          sha = os.environ["COMMIT_SHA"]
          ecr = os.environ["ECR_REPOSITORY_URL"]
          region = os.environ["AWS_REGION"]

          commands = [
              "mkdir -p /opt/tryckers/scripts",
              f"echo {deploy_b64} | base64 -d > /opt/tryckers/scripts/deploy.sh",
              "chmod +x /opt/tryckers/scripts/deploy.sh",
              f"echo {compose_b64} | base64 -d > /opt/tryckers/docker-compose.prod.yml",
              f"/opt/tryckers/scripts/deploy.sh \"{sha}\" \"{ecr}\" \"{region}\""
          ]

          with open("ssm_deploy_params.json", "w") as f:
              json.dump({"commands": commands}, f)
          '

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID || env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://ssm_deploy_params.json" \
            --comment "Deploy commit ${{ github.sha }} via GitHub Actions" \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command sent with ID: $COMMAND_ID"
          echo "Waiting for command execution to complete..."

          # Wait for execution and report status
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID || env.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            echo "Current Status: $STATUS"

            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment succeeded!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID || env.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID || env.EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done
